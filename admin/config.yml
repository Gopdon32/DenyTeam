backend:
  name: github
  repo: "Gopdon32/DenyTeam"
  branch: "main"
  auth_type: "implicit"
  # Disable local backend so CMS uses GitHub OAuth to commit files
  local_backend: false
  # Use GitHub OAuth implicit flow directly.
  app_id: "Ov23liCffDpzNbJ9SL19"
  # Optional: use Netlify auth endpoint for OAuth flow.
  base_url: "https://api.netlify.com/auth"
  # Callback URL for GitHub OAuth app: https://charming-sherbet-9d1521.netlify.app/admin/

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "list" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "projects_json"
    label: "Projects Index"
    files:
      - label: "Projects JSON"
        name: "projects"
        file: "data/projects.json"
        fields:
          - { label: "Raw JSON", name: "content", widget: "text" }
